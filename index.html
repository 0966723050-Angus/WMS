<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Warehouse Management System</title>
<meta name="description" content="ATK 倉儲管理系統 - 在線製令與物料明細查詢" />
<meta name="theme-color" content="#0f766e" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="sticky-head">
<header class="topbar">
  <a class="brand" href="#/">
    <img src="icons/atk-logo.png" alt="ATK" class="brand-logo" />
    <div class="brand-text">
      <span class="brand-title">Warehouse Management System</span>
      <span class="brand-sub">ATK 在線製令 &amp; 物料明細</span>
    </div>
  </a>
</header>
<nav class="actionbar icon-btn-group" aria-label="功能">
    <a id="home-btn" class="icon-btn icon-only-sm" href="#/" title="首頁(在線專案一覽表)" aria-label="首頁">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V9.5"/></svg>
      <span class="icon-label">首頁</span>
    </a>
    <a id="admin-btn" class="icon-btn" href="#/admin" title="登入名單管理" aria-label="登入名單管理" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      <span class="icon-label">名單管理</span>
    </a>
    <a id="storage-btn" class="icon-btn" href="#/storage" title="物料儲位查詢" aria-label="物料儲位查詢">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 1114 0c0 4.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span class="icon-label">儲位查詢</span>
    </a>
    <a id="erp-btn" class="icon-btn" href="#/erp" title="ERP" aria-label="ERP">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span class="icon-label">ERP</span>
    </a>
    <button id="refresh-btn" class="icon-btn refresh-btn icon-only-sm" type="button" title="重新整理(重新抓取線上最新資料)" aria-label="重新整理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 10-3 6.7M21 12v-5m0 5h-5"/></svg>
      <span class="icon-label">重新整理</span>
    </button>
</nav>
</div>

<main id="app" class="app"></main>

<footer class="footer">
  <span id="data-time"></span>
  <div id="user-info"></div>
</footer>

<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/pako_inflate.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
